name: Release PR

on:
  workflow_dispatch:
    inputs:
      channel:
        description: "npm dist-tag / channel to release"
        required: true
        type: choice
        options:
          - next
          - latest
      specifier:
        description: "Version bump (used only for the latest channel)"
        required: false
        type: choice
        default: patch
        options:
          - patch
          - minor
          - major

permissions:
  contents: write
  pull-requests: write

jobs:
  prepare-release-pr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
          registry-url: "https://registry.npmjs.org"

      - name: Upgrade npm
        # there is currently an issue installing latest npm on node 22, so we need to install a specific version
        # https://github.com/npm/cli/issues/9151
        run: npm install -g npm@11.15.0

      - name: Prepare release
        env:
          RUN_NUMBER: ${{ github.run_number }}
        run: node scripts/release.mjs ${{ inputs.channel }} ${{ inputs.specifier }}

      - name: Read version
        id: version
        run: echo "value=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Open release pull request
        uses: peter-evans/create-pull-request@v7
        with:
          branch: release/v${{ steps.version.outputs.value }}
          base: main
          title: "release: v${{ steps.version.outputs.value }}"
          commit-message: "release: v${{ steps.version.outputs.value }}"
          add-paths: |
            package.json
            package-lock.json
            .claude-plugin/marketplace.json
          body: |
            Automated `${{ inputs.channel }}` release PR for `v${{ steps.version.outputs.value }}`.

            Merging into `main` publishes the three plugin packages on npm with the
            `${{ inputs.channel }}` dist-tag. A maintainer must approve the publish in
            the `release-approval` environment before it reaches the live registry.
          delete-branch: true
