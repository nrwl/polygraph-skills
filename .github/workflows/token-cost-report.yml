name: Token Cost Report

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
  pull_request_target:
    types:
      - opened
      - reopened
      - synchronize

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: token-cost-report-${{ github.event_name }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  report:
    if: >-
      (github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository) ||
      (github.event_name == 'pull_request_target' &&
      github.event.pull_request.head.repo.full_name != github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out report code
        uses: actions/checkout@v4
        with:
          path: trusted
          persist-credentials: false

      - name: Check out pull request content
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          path: pull-request
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22.14.0

      - name: Install trusted report dependencies
        working-directory: trusted
        run: npm ci --ignore-scripts

      - name: Generate token cost report
        run: >-
          node trusted/scripts/report-token-costs.mjs
          --root-dir "$GITHUB_WORKSPACE/pull-request"
          > token-cost-report.md

      - name: Create or update pull request comment
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('node:fs');
            const marker = '<!-- polygraph-token-cost-report -->';
            const report = fs.readFileSync('token-cost-report.md', 'utf8').trim();
            const shortSha = context.payload.pull_request.head.sha.slice(0, 7);
            const body = `${marker}
            <details>
            <summary>Skill and subagent token-cost report</summary>

            ${report}

            </details>

            _Updated for commit \`${shortSha}\`._`;

            const comments = await github.paginate(
              github.rest.issues.listComments,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                per_page: 100,
              }
            );
            const existingComment = comments.find(
              (comment) =>
                comment.user?.type === 'Bot' && comment.body?.includes(marker)
            );

            if (existingComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existingComment.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
